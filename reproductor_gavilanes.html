<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Novelas & Series Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080d; --surface: #111118; --surface2: #18181f; --surface3: #222232;
            --border: rgba(255,255,255,0.08); --accent: #e50914; --text: #f0ede4;
            --muted: #7a7a96; --success: #46d369;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Utility */
        .hidden { display: none !important; }
        
        /* HEADER */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,8,13,0.9); backdrop-filter: blur(10px);
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--accent); letter-spacing: 1px; cursor: pointer; }
        
        /* VIEWS */
        .view { min-height: calc(100vh - 60px); }
        
        /* CATALOG VIEW */
        #catalog-view { padding: 20px; }
        .series-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .series-card {
            background: var(--surface2); border-radius: 10px; border: 1px solid var(--border);
            padding: 15px; text-align: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .series-card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(229,9,20,0.05); }
        .series-emoji { font-size: 3rem; margin-bottom: 10px; }
        .series-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; }
        .series-year { font-size: 0.7rem; color: var(--muted); }
        
        /* DETAILS VIEW */
        #details-view { padding: 20px; max-width: 800px; margin: 0 auto; }
        .back-nav { background:none; border:none; color:var(--text); font-size:1rem; cursor:pointer; margin-bottom:20px; display:flex; align-items:center; gap:8px; font-weight: 500; transition: color 0.2s; }
        .back-nav:hover { color: var(--accent); }
        
        .details-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 25px; flex-wrap: wrap; }
        .details-emoji { font-size: 5rem; background: var(--surface2); padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        .details-info h1 { font-size: 2rem; margin-bottom: 10px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
        .details-meta { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); margin-bottom: 15px; flex-wrap: wrap; }
        .details-meta span { background: var(--surface2); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
        .details-synopsis { font-size: 0.9rem; line-height: 1.5; color: rgba(255,255,255,0.8); margin-bottom: 20px; }
        
        .season-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); scrollbar-width: none; }
        .season-tabs::-webkit-scrollbar { display: none; }
        .season-tab { padding: 8px 16px; background: var(--surface2); border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border); white-space: nowrap; transition: all 0.2s; }
        .season-tab:hover { background: rgba(255,255,255,0.05); }
        .season-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .episodes-list { display: flex; flex-direction: column; gap: 8px; }
        .ep-card {
            display: flex; align-items: center; gap: 15px; background: var(--surface2);
            padding: 12px 15px; border-radius: 10px; cursor: pointer; border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .ep-card:hover { border-color: var(--accent); background: rgba(229,9,20,0.05); transform: translateX(4px); }
        .ep-card.watched { border-left: 3px solid var(--success); }
        .ep-num { font-family: 'Bebas Neue'; font-size: 1.5rem; color: var(--accent); min-width: 30px; text-align: center; opacity: 0.8; }
        .ep-info { flex: 1; min-width: 0; }
        .ep-title { font-size: 0.9rem; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-duration { font-size: 0.75rem; color: var(--muted); }
        .ep-play { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; transition: background 0.2s; }
        .ep-card:hover .ep-play { background: var(--accent); color: white; }
        
        /* PLAYER VIEW */
        #player-view { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: fixed; inset: 0; background: var(--bg); z-index: 1000; }
        .player-header {
            padding: 12px 15px; background: black; display: flex; align-items: center; gap: 15px;
        }
        .back-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        .player-title-info { flex: 1; min-width: 0; }
        .player-series-name { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-ep-name { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        
        .video-container { flex: 1; background: black; position: relative; width: 100%; }
        .video-container iframe { width: 100%; height: 100%; border: none; position: absolute; inset: 0; }
        
        .player-controls { background: var(--surface); padding: 15px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .servers-title { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .servers-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .servers-list::-webkit-scrollbar { display: none; }
        .server-btn { padding: 6px 14px; border-radius: 20px; background: var(--surface2); border: 1px solid var(--border); color: white; font-size: 0.8rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; text-transform: uppercase; }
        .server-btn.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(229,9,20,0.3); }
        
        .player-actions { display: flex; justify-content: space-between; gap: 10px; }
        .action-btn { flex: 1; padding: 12px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: white; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
        .action-btn:hover:not(:disabled) { background: var(--surface3); border-color: rgba(255,255,255,0.2); }
        .action-btn:active:not(:disabled) { transform: scale(0.97); }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-watched.marked { color: var(--success); border-color: var(--success); background: rgba(70,211,105,0.05); }
        
        @media (min-width: 768px) {
            .video-container { height: 65vh; max-height: 800px; margin: 0 auto; width: 100%; max-width: 1400px; flex: none; }
            #player-view { position: static; height: auto; }
            .details-header { flex-wrap: nowrap; }
            .series-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }

        /* ═══ LIVE TV ═══ */
        .live-badge { display:inline-flex; align-items:center; gap:5px; background:#e50914;
            color:#fff; font-size:0.6rem; font-weight:800; letter-spacing:0.12em;
            padding:3px 8px; border-radius:4px; text-transform:uppercase; flex-shrink:0; }
        .live-dot { width:6px; height:6px; border-radius:50%; background:#fff;
            animation:livepulse 1.2s ease-in-out infinite; flex-shrink:0; }
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes livepulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.6)} }
        
        .tv-cats { display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
        .tv-cats::-webkit-scrollbar { display:none; }
        .tv-cat-btn { padding:6px 16px; border-radius:20px; background:var(--surface2); border:1px solid var(--border);
            color:var(--muted); font-size:0.8rem; font-weight:500; cursor:pointer; white-space:nowrap;
            transition:all 0.2s; }
        .tv-cat-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
        
        .channels-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
        .channel-card { background:var(--surface2); border-radius:12px; border:1px solid var(--border);
            padding:20px 15px; text-align:center; cursor:pointer;
            transition:all 0.25s; position:relative; overflow:hidden; }
        .channel-card::before { content:''; position:absolute; inset:0; opacity:0;
            background:linear-gradient(135deg, rgba(229,9,20,0.15), transparent);
            transition:opacity 0.25s; }
        .channel-card:hover { transform:translateY(-5px); border-color:rgba(229,9,20,0.4);
            box-shadow:0 12px 30px rgba(0,0,0,0.4); }
        .channel-card:hover::before { opacity:1; }
        .ch-emoji { font-size:2.8rem; margin-bottom:12px; display:block; }
        .ch-name { font-size:0.88rem; font-weight:600; margin-bottom:6px; }
        .ch-cat { font-size:0.68rem; color:var(--muted); }
        .ch-live { position:absolute; top:10px; right:10px; }
        
        @media(max-width:840px){
            .channels-grid { grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; }
            .ch-emoji { font-size:2.2rem; }
        }

    </style>
</head>
<body>

    <header id="main-header">
        <div class="logo" onclick="showCatalog()">MIS NOVELAS</div>
        <button onclick="showTV()" id="nav-tv" style="background:rgba(229,9,20,0.12);border:1px solid rgba(229,9,20,0.3);color:#fff;border-radius:8px;padding:7px 14px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;letter-spacing:0.03em;display:flex;align-items:center;gap:6px;" onmouseover="this.style.background='rgba(229,9,20,0.25)'" onmouseout="this.style.background='rgba(229,9,20,0.12)'">
            <span style="width:7px;height:7px;border-radius:50%;background:#e50914;display:inline-block;animation:livepulse 1.2s ease-in-out infinite;box-shadow:0 0 8px #e50914;"></span>

        <div class="header-pill"><span class="dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--success); margin-right:5px; box-shadow:0 0 8px var(--success);"></span> ONLINE</div>

        <div class="series-grid" id="series-grid"></div>
    </div>

    <!-- DETAILS VIEW -->
    <div id="details-view" class="view hidden">
        <button class="back-nav" onclick="showCatalog()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Volver al catálogo
        </button>
        <div id="details-content"></div>

    <!-- PLAYER VIEW -->
    <div id="player-view" class="hidden">
        <div class="player-header">

            </button>
            <div class="player-title-info">

                <div class="player-ep-name" id="p-ep-name">Episodio</div>
            </div>
        </div>
        
        <div class="video-container" id="video-container">

        </div>
        
        <div class="player-controls">
            <div class="servers-title">Servidores</div>
            <div class="servers-list" id="servers-list"></div>
            
            <div class="player-actions">
                <button class="action-btn" id="btn-prev" onclick="playPrev()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
                    Anterior

                <button class="action-btn btn-watched" id="btn-mark" onclick="toggleWatched()">

                card.onclick = () => openSeries(nid);
                card.innerHTML = `
                    <div class="series-emoji">${meta.emoji}</div>
                    <div class="series-title">${meta.titulo}</div>
                    <div class="series-year">${meta.año} • ${meta.pais}</div>
                `;
                grid.appendChild(card);
            }
        }

        function openSeries(nid) {
            currentSeries = nid;
            document.getElementById('catalog-view').classList.add('hidden');
            document.getElementById('details-view').classList.remove('hidden');
            window.scrollTo(0,0);
            
            const meta = NOVELAS_META[nid];
            const eps = EPISODES[nid] || [];
            
            // Get seasons
            const seasons = [...new Set(eps.map(e => e.temporada || 1))].sort((a,b)=>a-b);
            if (!currentSeason || !seasons.includes(currentSeason)) {
                currentSeason = seasons[0];
            }
            
            let html = `
                <div class="details-header">
                    <div class="details-emoji">${meta.emoji}</div>
                    <div class="details-info">
                        <h1>${meta.titulo}</h1>
                        <div class="details-meta">
                            <span>⭐ ${meta.rating}</span>
                            <span>📅 ${meta.año}</span>
                            <span>🌎 ${meta.pais}</span>
                            <span>🎭 ${meta.genero}</span>
                        </div>
                        <div class="details-synopsis">${meta.sinopsis}</div>
                    </div>
                </div>
            `;
            
            if (seasons.length > 1) {
                html += `<div class="season-tabs">`;
                seasons.forEach(s => {
                    html += `<div class="season-tab ${s === currentSeason ? 'active' : ''}" onclick="setSeason(${s})">Temporada ${s}</div>`;
                });
                html += `</div>`;
            }
            
            html += `<div class="episodes-list" id="episodes-list"></div>`;
            document.getElementById('details-content').innerHTML = html;
            
            renderEpisodes();
        }

        function setSeason(s) {
            currentSeason = s;
            openSeries(currentSeries); // Re-render details
        }

        function renderEpisodes() {
            const list = document.getElementById('episodes-list');
            list.innerHTML = '';
            const eps = (EPISODES[currentSeries] || []).filter(e => (e.temporada || 1) === currentSeason);
            
            eps.forEach(ep => {
                const watched = isWatched(currentSeries, ep.capitulo);
                const card = document.createElement('div');
                card.className = `ep-card ${watched ? 'watched' : ''}`;
                card.onclick = () => playEpisode(ep);
                
                let srvCount = Object.keys(ep.servidores || {}).length;
                
                card.innerHTML = `
                    <div class="ep-num">${ep.capitulo}</div>
                    <div class="ep-info">
                        <div class="ep-title">${ep.titulo || 'Capítulo ' + ep.capitulo}</div>
                        <div class="ep-duration">${srvCount} servidores disponibles</div>
                    </div>
                    <div class="ep-play">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function playEpisode(ep) {
            currentEp = ep;
            document.getElementById('catalog-view').classList.add('hidden');
            document.getElementById('details-view').classList.add('hidden');
            document.getElementById('player-view').classList.remove('hidden');
            document.getElementById('main-header').classList.add('hidden');
            
            window.scrollTo(0,0);
            document.getElementById('p-series-name').textContent = NOVELAS_META[currentSeries].titulo + (ep.temporada > 1 ? ` - T${ep.temporada}` : '');
            document.getElementById('p-ep-name').textContent = ep.titulo || ('Capítulo ' + ep.capitulo);
            
            updatePlayerControls();
            
            // Auto play first server
            const servers = Object.keys(ep.servidores || {});
            if(servers.length > 0) {
                let preferredServer = null;
                if (currentSeries === 'gavilanes') preferredServer = 'vk';
                else if (currentSeries === 'bella') preferredServer = 'vidspeeds';
                else if (currentSeries === 'riverdale') preferredServer = 'nupload_1';

                let firstSrv = servers[0];
                if (preferredServer && servers.includes(preferredServer)) {
                    firstSrv = preferredServer;
                } else {
                    for (let s of servers) {
                        if (s.includes('waaw') || ep.servidores[s].includes('iframe') || ep.servidores[s].includes('embed')) {
                            firstSrv = s;
                            break;
                        }
                    }
                }
                loadServer(firstSrv);
            }
            else document.getElementById('video-container').innerHTML = '<div style="color:white; padding:20px; text-align:center;">No hay servidores disponibles.</div>';
        }

        function loadServer(srvName) {
            const url = currentEp.servidores[srvName];
            document.getElementById('video-container').innerHTML = `<iframe src="${url}" frameborder="0" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen"></iframe>`;
            
            // Update active server button
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`srv-btn-${srvName}`);
            if (btn) btn.classList.add('active');
            
            // Auto mark removed, user must click mark as watched
        }

        function updatePlayerControls() {
            const eps = (EPISODES[currentSeries] || []).filter(e => (e.temporada || 1) === currentSeason);
            const idx = eps.findIndex(e => e.capitulo === currentEp.capitulo);
            
            document.getElementById('btn-prev').disabled = idx <= 0;
            document.getElementById('btn-next').disabled = idx >= eps.length - 1;
            
            const watched = isWatched(currentSeries, currentEp.capitulo);
            const markBtn = document.getElementById('btn-mark');
            markBtn.className = `action-btn btn-watched ${watched ? 'marked' : ''}`;
            
            const servers = currentEp.servidores || {};
            const srvList = document.getElementById('servers-list');
            srvList.innerHTML = '';
            for (let s in servers) {
                srvList.innerHTML += `<button class="server-btn" id="srv-btn-${s}" onclick="loadServer('${s}')">${s.replace('_',' ')}</button>`;
            }
        }

        function toggleWatched() {
            const state = !isWatched(currentSeries, currentEp.capitulo);
            setWatched(currentSeries, currentEp.capitulo, state);
            updatePlayerControls();
        }

        function playPrev() {
            const eps = (EPISODES[currentSeries] || []).filter(e => (e.temporada || 1) === currentSeason);
            const idx = eps.findIndex(e => e.capitulo === currentEp.capitulo);
            if (idx > 0) playEpisode(eps[idx - 1]);
        }

        function playNext() {
            const eps = (EPISODES[currentSeries] || []).filter(e => (e.temporada || 1) === currentSeason);
            const idx = eps.findIndex(e => e.capitulo === currentEp.capitulo);
            if (idx < eps.length - 1) playEpisode(eps[idx + 1]);
        }

        function closePlayer() {
            document.getElementById('video-container').innerHTML = ''; // Stop video
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('details-view').classList.remove('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            renderEpisodes(); // Refresh list to show watched status
        }


        // ═══════════════════════════════
        // TV EN VIVO
        // ═══════════════════════════════
        const CHANNELS = [{"id": "tudn", "name": "TUDN", "emoji": "🏆", "cat": "Fútbol", "stream": "tudn_usa", "color": "#0b4ea2"}, {"id": "espnp", "name": "ESPN Premium", "emoji": "🎽", "cat": "Deportes", "stream": "espnpremium", "color": "#cc0000"}, {"id": "espn1", "name": "ESPN", "emoji": "⚡", "cat": "Deportes", "stream": "espn", "color": "#cc0000"}, {"id": "foxsp", "name": "Fox Sports", "emoji": "🦊", "cat": "Deportes", "stream": "foxsports", "color": "#0099d6"}, {"id": "tyc", "name": "TyC Sports", "emoji": "🇦🇷", "cat": "Fútbol", "stream": "tycsports", "color": "#e30613"}, {"id": "tnt", "name": "TNT Sports", "emoji": "💣", "cat": "Deportes", "stream": "tntsports", "color": "#0f3460"}, {"id": "dsports", "name": "DirecTV Sports", "emoji": "📡", "cat": "Deportes", "stream": "dsports", "color": "#00a2e8"}, {"id": "winplus", "name": "Win Sports+", "emoji": "🏅", "cat": "Fútbol", "stream": "winplus", "color": "#e4002b"}];
        let currentCat = 'all';

        function showTV() {
            document.getElementById('catalog-view').classList.add('hidden');
            document.getElementById('details-view').classList.add('hidden');
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('tv-view').classList.remove('hidden');
            document.getElementById('tv-player-view').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            renderTVCats();
            renderChannels();
            window.scrollTo(0,0);
        }

        function renderTVCats() {
            const cats = ['all', ...new Set(CHANNELS.map(c=>c.cat))];
            const labels = {'all':'Todos'};
            const el = document.getElementById('tv-cats');
            el.innerHTML = cats.map(c =>
                `<button class="tv-cat-btn ${c===currentCat?'active':''}" onclick="filterCat('${c}')">${labels[c]||c}</button>`
            ).join('');
        }

        function filterCat(cat) {
            currentCat = cat;
            renderTVCats();
            renderChannels();
        }

        function renderChannels() {
            const filtered = currentCat==='all' ? CHANNELS : CHANNELS.filter(c=>c.cat===currentCat);
            document.getElementById('channels-grid').innerHTML = filtered.map(ch => `
                <div class="channel-card" onclick="openChannel('${ch.id}')">
                    <span class="ch-live"><span class="live-badge"><span class="live-dot"></span>EN VIVO</span></span>
                    <span class="ch-emoji">${ch.emoji}</span>
                    <div class="ch-name">${ch.name}</div>
                    <div class="ch-cat">${ch.cat}</div>
                </div>
            `).join('');
        }

        // HLS.js loaded dynamically
        let hlsPlayer = null;
        let currentTVChannel = null;
        const PROXY = 'https://corsproxy.io/?';

        async function openChannel(chId) {
            const ch = CHANNELS.find(c=>c.id===chId);
            if(!ch) return;
            currentTVChannel = ch;

            document.getElementById('tv-view').classList.add('hidden');
            document.getElementById('tv-player-view').classList.remove('hidden');
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('tv-ch-name').textContent = ch.emoji + ' ' + ch.name;

            // Reset state
            document.getElementById('tv-loading').style.display = 'flex';
            document.getElementById('tv-fallback').classList.add('hidden');
            document.getElementById('tv-status').textContent = 'Conectando al canal...';

            // Render channel switcher
            document.getElementById('tv-ch-list').innerHTML = CHANNELS.map(c =>
                `<button onclick="openChannel('${c.id}')" style="padding:7px 14px;border-radius:20px;background:${c.id===chId?'var(--accent)':'rgba(255,255,255,0.1)'};border:1px solid ${c.id===chId?'var(--accent)':'rgba(255,255,255,0.15)'};color:white;font-size:0.78rem;font-weight:${c.id===chId?'700':'400'};cursor:pointer;white-space:nowrap;flex-shrink:0;">${c.emoji} ${c.name}</button>`
            ).join('');

            window.scrollTo(0,0);

            // Load HLS.js if not loaded
            if (!window.Hls) {
                await loadScript('https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js');
            }

            // Fetch m3u8 URL via CORS proxy
            const canalUrl = `https://latamvidz1.com/canal.php?stream=${ch.stream}`;
            try {
                document.getElementById('tv-status').textContent = 'Obteniendo stream...';
                const resp = await fetch(PROXY + encodeURIComponent(canalUrl), { signal: AbortSignal.timeout(10000) });
                const html = await resp.text();
                const match = html.match(/var playbackURL\s*=\s*"([^"]+)"/);
                if (!match) throw new Error('No m3u8 found');
                const m3u8 = match[1];
                playHLS(m3u8);
            } catch(e) {
                console.warn('Proxy failed, trying iframe fallback:', e);
                document.getElementById('tv-status').textContent = 'Cargando alternativo...';
                document.getElementById('tv-fallback').classList.remove('hidden');
                useFallbackIframe();
            }
        }

        function playHLS(m3u8url) {
            const video = document.getElementById('tv-video');
            if(hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }

            if(Hls.isSupported()) {
                hlsPlayer = new Hls({ lowLatencyMode: true });
                hlsPlayer.loadSource(m3u8url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    document.getElementById('tv-loading').style.display = 'none';
                    video.play().catch(()=>{});
                });
                hlsPlayer.on(Hls.Events.ERROR, (e, data) => {
                    if(data.fatal) {
                        console.warn('HLS error, fallback iframe');
                        document.getElementById('tv-fallback').classList.remove('hidden');
                    }
                });
            } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = m3u8url;
                video.addEventListener('loadedmetadata', () => {
                    document.getElementById('tv-loading').style.display = 'none';
                    video.play().catch(()=>{});
                });
            } else {
                useFallbackIframe();
            }
        }

        function useFallbackIframe() {
            if(!currentTVChannel) return;
            document.getElementById('tv-loading').style.display = 'none';
            const video = document.getElementById('tv-video');
            video.style.display = 'none';
            // Create iframe overlay
            const existing = document.getElementById('tv-iframe-fallback');
            if(existing) existing.remove();
            const iframe = document.createElement('iframe');
            iframe.id = 'tv-iframe-fallback';
            iframe.src = `https://latamvidz1.com/canal.php?stream=${currentTVChannel.stream}`;
            iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;';
            iframe.allowFullscreen = true;
            iframe.allow = 'autoplay; fullscreen';
            document.getElementById('tv-video-container').appendChild(iframe);
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                if(document.querySelector(`script[src="${src}"]`)) return resolve();
                const s = document.createElement('script');
                s.src = src; s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        function closeTV() {
            const video = document.getElementById('tv-video');
            video.pause(); video.src = ''; video.style.display = '';
            const fi = document.getElementById('tv-iframe-fallback');
            if(fi) fi.remove();
            if(hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
            document.getElementById('tv-player-view').classList.add('hidden');
            document.getElementById('tv-view').classList.remove('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        window.onload = init;
    </script>

    <!-- TV EN VIVO VIEW -->
    <div id="tv-view" class="view hidden" style="padding:20px;max-width:1200px;margin:0 auto;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
            <div>
                <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:10px;">
                    📡 TV en Vivo
                    <span class="live-badge"><span class="live-dot"></span>LIVE</span>
                </h2>
                <p style="font-size:0.82rem;color:var(--muted);">Canales deportivos en vivo</p>
            </div>
            <button onclick="showCatalog()" style="background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:0.8rem;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--muted)'">
                ← Mis Novelas
            </button>
        </div>
        
        <div class="tv-cats" id="tv-cats"></div>
        <div class="channels-grid" id="channels-grid"></div>
    </div>

    <!-- TV PLAYER VIEW -->
    <div id="tv-player-view" class="hidden" style="display:flex;flex-direction:column;height:100vh;height:100dvh;position:fixed;inset:0;background:#000;z-index:1000;">
        <div style="padding:12px 15px;background:rgba(0,0,0,0.85);display:flex;align-items:center;gap:15px;position:absolute;top:0;left:0;right:0;z-index:10;">
            <button onclick="closeTV()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:50%;width:38px;height:38px;color:white;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                ←
            </button>
            <div style="flex:1;min-width:0;">
                <div style="font-size:0.65rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;">TV en Vivo</div>
                <div style="font-size:1rem;font-weight:600;color:white;" id="tv-ch-name">Canal</div>
            </div>
            <span class="live-badge"><span class="live-dot"></span>LIVE</span>
        </div>
        
        <!-- Video container fills full screen -->
        <div id="tv-video-container" style="position:absolute;inset:0;background:#000;">
            <video id="tv-video" style="width:100%;height:100%;object-fit:contain;" controls playsinline></video>
            <div id="tv-loading" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;gap:16px;">
                <div style="font-size:3rem;animation:spin 1s linear infinite;">⟳</div>
                <div id="tv-status" style="font-size:0.9rem;color:rgba(255,255,255,0.6);">Conectando al canal...</div>
                <div id="tv-fallback" class="hidden" style="margin-top:10px;text-align:center;">
                    <p style="font-size:0.8rem;color:rgba(255,255,255,0.4);margin-bottom:10px;">Reproductor alternativo</p>
                    <button onclick="useFallbackIframe()" style="background:var(--accent);border:none;color:white;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:600;">Abrir reproductor alternativo</button>
                </div>
            </div>
        </div>
        
        <!-- Bottom channel switcher -->
        <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.9));padding:20px 16px 14px;">
            <div style="font-size:0.65rem;color:rgba(255,255,255,0.4);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;font-weight:600;">Canales</div>
            <div id="tv-ch-list" style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;"></div>
        </div>
    </div>

</body>
</html>
